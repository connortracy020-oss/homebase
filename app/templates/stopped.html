<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homebase stopped</title>
  <script>try { var t = localStorage.getItem("homebase.theme"); document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section class="card" style="margin-top:12vh; text-align:center">
      <h1 style="font-size:22px; margin:6px 0">Homebase has stopped</h1>
      <p class="muted small">Everything is saved. Your phone can't reach it until you open it again.</p>
      <p class="muted small">Open it again from the Start menu, or close this window.</p>
    </section>
  </main>
</body>
</html>
