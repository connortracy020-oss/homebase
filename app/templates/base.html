<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e6">
  <title>{% block title %}Homebase{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Homebase</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Today</a>
      <a href="/plan" {% if request.url.path == '/plan' %}aria-current="page"{% endif %}>Plan</a>
      {% for c in courses %}
      <a href="/course/{{ c.code }}" style="--accent: {{ c.color }}"
         {% if request.url.path.startswith('/course/' ~ c.code) %}aria-current="page"{% endif %}>{{ c.name }}</a>
      {% endfor %}
      <a href="/progress" {% if request.url.path == '/progress' %}aria-current="page"{% endif %}>Progress</a>
      <a href="/settings" {% if request.url.path == '/settings' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
